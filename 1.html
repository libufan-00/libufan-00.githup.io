<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Amount Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #E6E2DD;
            position: relative;
            overflow: hidden;
            padding: 12px;
        }
        .coin {
            position: absolute;
            font-size: 36px;
            animation: float 5s ease-in-out infinite;
            opacity: 0.65;
            pointer-events: none;
            user-select: none;
        }
        @keyframes float {
            0%,100% {transform: translateY(0) rotate(0deg);}
            50% {transform: translateY(-20px) rotate(8deg);}
        }
        .container {
            background: #D8D4CE;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 8px 32px #b9b3ac80;
            width: min(100%, 520px);
            z-index: 2;
        }
        h1 {
            text-align: center;
            color: #6B6560;
            margin-bottom:30px;
            letter-spacing:1px;
        }
        .input-box {
            margin-bottom:22px;
        }
        label {
            display:block;
            color:#59544F;
            margin-bottom:8px;
            font-size:17px;
        }
        #moneyInput {
            width:100%;
            padding:14px 16px;
            border:2px solid #C9C3BC;
            border-radius:12px;
            background:#F1EDE8;
            font-size:20px;
            outline:none;
            color:#444;
        }
        #moneyInput::placeholder {
            font-size: 15px;
            color: #8b847d;
        }
        #moneyInput:focus {
            border-color:#A8A198;
        }
        .result-box {
            background:#EBE7E1;
            padding:18px;
            border-radius:12px;
            min-height:75px;
            word-break:break-all;
            font-size:18px;
            color:#4E4A45;
            margin-bottom:12px;
            line-height: 1.5;
        }
        .rate-box{
            background:#e3dfd8;
            padding:15px;
            border-radius:12px;
            min-height:65px;
            font-size:17px;
            color:#444;
            margin-bottom:20px;
            display:none;
            line-height: 1.5;
            word-break: break-word;
        }
        .button-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }
        #copyBtn {
            width:100%;
            padding:13px;
            background:#B9B2A9;
            border:none;
            border-radius:12px;
            color:#fff;
            font-size:17px;
            cursor:pointer;
            transition:0.25s;
        }
        #copyBtn:hover {
            background:#A09990;
        }
        #copyBtn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        #clearBtn {
            padding:13px 16px;
            background:#8f867d;
            border:none;
            border-radius:12px;
            color:#fff;
            font-size:17px;
            cursor:pointer;
            transition:0.25s;
            min-width: 92px;
        }
        #clearBtn:hover {
            background:#7f766d;
        }
        .tip-text{
            text-align:center;
            margin-top:10px;
            color:#666;
            font-size:14px;
            line-height:1.5;
        }
        .money-bag{
            position:fixed;
            right:-80px;
            top:45%;
            font-size:70px;
            animation:bagBoom 1.3s ease-out forwards;
            z-index:999;
            pointer-events:none;
        }
        @keyframes bagBoom{
            0%{right:-80px;transform:scale(0.4) rotate(0deg);opacity:0;}
            40%{right:12%;transform:scale(1.3) rotate(-15deg);opacity:1;}
            70%{transform:scale(2.2) rotate(10deg);opacity:0.9;}
            100%{transform:scale(3.5) rotate(25deg);opacity:0;right:12%;}
        }
        .success-pop {
            position:fixed;
            left:50%;
            top:40%;
            transform:translateX(-50%);
            font-size:42px;
            color:#7A746C;
            font-weight:bold;
            animation: popAnim 1.3s ease-out forwards;
            z-index:998;
            pointer-events:none;
        }
        @keyframes popAnim {
            0%{transform:translateX(-50%) scale(0.3);opacity:0;}
            50%{transform:translateX(-50%) scale(1.2);opacity:1;}
            100%{transform:translateX(-50%) scale(1);opacity:0;}
        }
        @media (max-width: 560px) {
            body { padding: 10px; }
            .container { padding: 28px 18px; }
            #moneyInput { font-size: 18px; }
            .button-row {
                grid-template-columns: 1fr;
            }
            #clearBtn {
                width: 100%;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
        .coin.small { font-size: 24px; opacity: 0.5; }
        .coin.medium { font-size: 30px; opacity: 0.6; }
        .coin.large { font-size: 42px; opacity: 0.55; }
        .coin.slow { animation-duration: 7s; }
        .coin.fast { animation-duration: 4s; }
    </style>
</head>
<body>
<div class="coin" style="left:5%;top:15%;">💰</div>
<div class="coin" style="right:6%;top:25%;animation-delay:1s;">💴</div>
<div class="coin" style="left:8%;bottom:20%;animation-delay:2s;">💵</div>
<div class="coin" style="right:9%;bottom:30%;animation-delay:3s;">💶</div>
<div class="coin small slow" style="left:15%;top:68%;animation-delay:.5s;">💵</div>
<div class="coin medium fast" style="left:22%;top:28%;animation-delay:1.8s;">💴</div>
<div class="coin small slow" style="right:18%;top:60%;animation-delay:2.4s;">💶</div>
<div class="coin large fast" style="right:14%;top:8%;animation-delay:3.2s;">💰</div>
<div class="coin medium" style="left:42%;bottom:8%;animation-delay:1.2s;">🪙</div>
<div class="coin small fast" style="left:55%;top:18%;animation-delay:2.7s;">💸</div>
<div class="coin medium slow" style="right:32%;bottom:18%;animation-delay:4s;">💴</div>
<div class="coin small" style="left:72%;top:42%;animation-delay:3.6s;">💵</div>

<div class="container">
    <h1>Amount Converter</h1>
    <div class="input-box">
        <label>Input Number or Number+Currency</label>
        <input id="moneyInput" inputmode="decimal" autocomplete="off" placeholder="Only number → Chinese uppercase | Number+Currency → Exchange rate">
    </div>
    <div class="result-box" id="result"></div>
    <div class="rate-box" id="rateBox"></div>
    <div class="button-row">
        <button id="copyBtn" disabled>Copy Result</button>
        <button id="clearBtn" type="button">Clear</button>
    </div>
    <p class="tip-text">Press Ctrl+V to paste anywhere</p>
</div>

<script>
    const rateMap = {
        "美元":7.22,
        "欧元":7.85,
        "英镑":9.28,
        "日元":0.047,
        "韩元":0.0052,
        "港币":0.92
    };

    function digitToChinese(amount) {
        if(isNaN(amount)||amount<0) return "";
        const digit = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
        const unitInt = ['元','拾','佰','仟','万','拾','佰','仟','亿'];
        const unitDec = ['角','分'];
        let num = Number(amount).toFixed(2);
        let [intStr,decStr] = num.split('.');
        let intArr = intStr.split('').reverse();
        let decArr = decStr.split('');
        let res = "";
        for(let i=0;i<intArr.length;i++){
            let n = parseInt(intArr[i]);
            if(n!==0) res = digit[n]+unitInt[i]+res;
            else {
                if(res.length>0&&!res.startsWith('零')) res = '零'+res;
            }
        }
        if(decArr[0]!='0') res += digit[decArr[0]]+unitDec[0];
        if(decArr[1]!='0') res += digit[decArr[1]]+unitDec[1];
        if(!res) res = '零元整';
        else if(!res.includes('角')&&!res.includes('分')) res+='整';
        return res;
    }

    const input = document.getElementById('moneyInput');
    const resultDom = document.getElementById('result');
    const rateBox = document.getElementById('rateBox');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    let lastText = "";

    function copyFallback(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        let ok = false;
        try {
            ok = document.execCommand('copy');
        } catch (e) {
            ok = false;
        }
        document.body.removeChild(textarea);
        return ok;
    }

    function showSuccess() {
        let popText = document.createElement('div');
        popText.className = "success-pop";
        popText.innerText = "Success!";
        document.body.appendChild(popText);
        setTimeout(()=>popText.remove(),1300);

        let bag = document.createElement('div');
        bag.className = 'money-bag';
        bag.innerText = '💸';
        document.body.appendChild(bag);
        setTimeout(()=>bag.remove(),1300);
    }

    input.oninput = ()=>{
        let val = input.value.trim();
        rateBox.style.display = 'none';
        rateBox.innerText = '';
        let numStr = val.replace(/[^0-9.]/g,'');
        let num = Number(numStr);
        lastText = digitToChinese(num);
        resultDom.innerText = lastText;
        resultDom.classList.toggle('empty', !lastText);
        copyBtn.disabled = !lastText;

        let curr = "";
        for(let key in rateMap){
            if(val.includes(key)) curr = key;
        }
        if(curr && !isNaN(num)&&num>0){
            let rmb = (num * rateMap[curr]).toFixed(2);
            rateBox.innerText = `${num}${curr} = ${rmb} CNY, Rate: 1${curr}=${rateMap[curr]}CNY`;
            rateBox.style.display = 'block';
        }
    }

    copyBtn.onclick = async ()=>{
        if(!lastText)return;
        let ok = false;
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(lastText);
                ok = true;
            } else {
                ok = copyFallback(lastText);
            }
        } catch (e) {
            ok = copyFallback(lastText);
        }
        if (!ok) return;
        showSuccess();
    }

    clearBtn.onclick = ()=>{
        input.value = '';
        rateBox.style.display = 'none';
        rateBox.innerText = '';
        lastText = '';
        resultDom.innerText = '';
        resultDom.classList.add('empty');
        copyBtn.disabled = true;
        input.focus();
    }
</script>
</body>
</html>
